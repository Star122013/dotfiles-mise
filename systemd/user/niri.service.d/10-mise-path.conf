[Service]
# Put mise's shims on PATH for the whole niri session.
#
# niri runs as a systemd user unit started by niri-session from greetd.
# niri-session runs `systemctl --user import-environment`, which imports the
# greetd login-session PATH into the user manager and overwrites the PATH set
# by ~/.config/environment.d (that is why TERMINFO_DIRS from there survives but
# PATH does not). A unit-level Environment= is applied after the manager
# environment, so it wins and is inherited by everything niri spawns
# (spawn-at-startup, keybinds, terminals, Noctalia template hooks, ...).
Environment=PATH=%h/.local/share/mise/shims:%h/.local/bin:%h/.local/share/npm/bin:%h/.bin:/usr/local/bin:/usr/bin:/usr/local/sbin