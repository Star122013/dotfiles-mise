# Route FileChooser to the GTK portal.
# xdg-desktop-portal-gnome >= 48 uses nautilus for its file chooser; when
# nautilus isn't running the dialog fails to open on niri. GTK portal has its
# own native dialog and needs no nautilus. Keep gnome portal for the rest
# (niri screencasting depends on it) — only FileChooser is rerouted.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=gtk
