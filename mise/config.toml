[tools]
hunk = "latest"
pi = "latest"

# ---- CLI / editors ----
jq = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
zoxide = "latest"
bat = "latest"
gh = "latest"
yazi = "latest"
just = "latest"
pandoc = "latest"
fastfetch = "latest"
btop = "latest"
starship = "latest"
helix = { backend = "aqua", version = "latest" } # helix-editor/helix

# ---- runtimes / toolchains ----
nodejs = "latest"
zig = "latest"
uv = "latest"
typst = "latest"
tree-sitter = "latest"

# ---- LSPs ----
zls = "latest"
lua-language-server = "latest"
tinymist = "latest"
stylua = "latest"
oh-my-pi = { version = "latest", rename_exe = "omp" }

[settings]
dotfiles.default_mode = "copy"

[dotfiles]
# ---- app configs (dotfiles repo, whole dir or file) ----
"~/.config/nvim" = "../../dotfiles/nvim"
"~/.config/niri" = "../../dotfiles/niri"
"~/.config/hypr" = "../../dotfiles/hypr"
"~/.config/helix" = "../../dotfiles/helix"
"~/.config/mpv" = "../../dotfiles/mpv"
"~/.config/yt-dlp" = "../../dotfiles/yt-dlp"
"~/.config/vicinae" = "../../dotfiles/vicinae"
"~/.config/go-musicfox" = "../../dotfiles/go-musicfox"

# pi agent: global extensions (~/.pi/agent/extensions), one dir per extension
"~/.pi/agent/extensions/compact-ui" = "../../dotfiles/pi/agent/extensions/compact-ui"
"~/.pi/agent/extensions/hunk-gate" = "../../dotfiles/pi/agent/extensions/hunk-gate"
"~/.pi/agent/extensions/toolbox" = "../../dotfiles/pi/agent/extensions/toolbox"

# pi agent: global instructions
"~/.pi/agent/AGENTS.md" = "../../dotfiles/pi/agent/AGENTS.md"

"~/.config/starship.toml" = "../../dotfiles/starship.toml"
"~/.config/ghostty/config" = "../../dotfiles/ghostty/config"
"~/.config/nushell/config.nu" = "../../dotfiles/nushell/config.nu"
"~/.config/nushell/env.nu" = "../../dotfiles/nushell/env.nu"

"~/.config/sway/config" = "../../dotfiles/sway/config"
"~/.config/sway/config.d" = "../../dotfiles/sway/config.d"
"~/.config/sway/color_01.icc" = "../../dotfiles/sway/color_01.icc"
"~/.config/sway/colors" = "../../dotfiles/sway/colors" # stylix snapshot

# emacs: file-level only (runtime dirs elpa/eln-cache/... stay real)
"~/.config/emacs/init.el" = "../../dotfiles/emacs/init.el"
"~/.config/emacs/early-init.el" = "../../dotfiles/emacs/early-init.el"
"~/.config/emacs/extras" = "../../dotfiles/emacs/extras"
"~/.config/emacs/assets" = "../../dotfiles/emacs/assets"
"~/.config/emacs/user-lisp" = "../../dotfiles/emacs/user-lisp"

# ---- home root files (native dotfiles) ----
"~/.profile" = "../../dotfiles/.profile"
"~/.bashrc" = "../../dotfiles/.bashrc"
"~/.bash_profile" = "../../dotfiles/.bash_profile"
"~/.npmrc" = "../../dotfiles/.npmrc"
"~/.Xresources" = "../../dotfiles/.Xresources"
"~/.config/environment.d/10-mise.conf" = "../../dotfiles/environment.d/10-mise.conf"
"~/.config/mimeapps.list" = "../../dotfiles/mimeapps.list"
"~/.config/fontconfig/fonts.conf" = "../../dotfiles/fontconfig/fonts.conf"
"~/.config/fontconfig/conf.d/50-reject-colrv1.conf" = "../../dotfiles/fontconfig/conf.d/50-reject-colrv1.conf"
"~/.config/fish/config.fish" = "../../dotfiles/fish/config.fish"

# ---- noctalia user templates (dotfile-managed, copy mode) ----
"~/.config/noctalia/templates.toml" = "../../dotfiles/noctalia/templates.toml"
"~/.config/noctalia/templates/nvim-palette.lua" = "../../dotfiles/noctalia/templates/nvim-palette.lua"

[tasks]
apply-dotfiles = "mise bootstrap dotfiles apply"
status-dotfiles = "mise bootstrap dotfiles status"

# ---- mise self-management ----
# config.toml lives in the dotfiles repo; the entry below makes mise manage
# its own config file. mode=symlink on purpose: mise rewrites this file often
# (mise set/use/...), so a symlink keeps the repo in sync automatically.
[dotfiles."~/.config/mise/config.toml"]
source = "~/dotfiles/mise/config.toml"
mode = "symlink"

# ---- noctalia user templates (dotfile-managed, copy mode) ----
"~/.config/noctalia/templates.toml" = "../../dotfiles/noctalia/templates.toml"
"~/.config/noctalia/templates/nvim-palette.lua" = "../../dotfiles/noctalia/templates/nvim-palette.lua"
