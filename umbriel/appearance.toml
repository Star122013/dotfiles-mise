# ─────────────────────────────── Colors ─────────────────────────────────────
# Documentation: https://docs.noctalia.dev/umbriel/appearance/#colors
# ────────────────────────────────────────────────────────────────────────────

[colors]
background = "#1E1E2EFF"                      # Internal panels and banners
text_primary = "#CDD6F4FF"                    # Primary text
text_muted = "#BAC2DEFF"                      # Secondary help and status text
accent_primary = "#CBA6F7FF"                  # Titles, key chords, and primary emphasis
accent_secondary = "#89DCEBFF"                # Group headings and secondary emphasis
warning = "#F9E2AFFF"                         # Warning text and warning-only diagnostics
error = "#F38BA8FF"                           # Error text, confirmations, and diagnostics
insert_hint = "#CBA6F780"                     # Drag-and-drop target preview
backdrop = "#11111BFF"                        # Fullscreen gaps and lock screen
shadow = "#11111B70"                          # Window shadow

[colors.border]
focused = "#89B4FAFF"                         # Blue focus ring
unfocused = "#313244FF"
outer = "#181825FF"
# Scratchpad border colors live in the matching window rule (match.is_scratchpad)
# in rules.toml.

[colors.overview]
background_tint = "#18182540"                 # Tint over the desktop background
workspace_background = "#11111B44"            # Background behind each workspace
badge = "#89B4FAFF"                           # Overview shortcut badge

# ───────────────────────────── Appearance ───────────────────────────────────
# Documentation: https://docs.noctalia.dev/umbriel/appearance/#window-appearance
# ────────────────────────────────────────────────────────────────────────────

[appearance]
prefer_no_csd = true                            # Prefer Umbriel's border-only decoration
border_width = 2                                # Inner border width, 0-100 logical pixels
outer_border_width = 0                          # Optional outer ring, 0-100 logical pixels
corner_radius = 10                              # Radius of the final decorated edge, 0-100
drag_opacity = 0.75                             # Window opacity during a tiled or floating drag

[appearance.blur]
# Global blur engine. A matching window or layer rule must still opt a surface
# into blur.
enabled = true
optimized = true
passes = 4
radius = 10
noise = 0.02
brightness = 1.0
contrast = 1.0
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 24                                   # Gaussian softness, 0-200
offset_x = 0
offset_y = 5
