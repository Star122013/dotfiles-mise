# ─────────────────────────────── Colors ─────────────────────────────────────
# Documentation: https://docs.noctalia.dev/umbriel/appearance/#colors
# ────────────────────────────────────────────────────────────────────────────

[colors]
background = "#232136FF"                      # Internal panels and banners
text_primary = "#E0DEF4FF"                    # Primary text
text_muted = "#908CAAFF"                      # Secondary help and status text
accent_primary = "#C4A7E7FF"                  # Titles, key chords, and primary emphasis
accent_secondary = "#9CCFD8FF"                # Group headings and secondary emphasis
warning = "#F6C177FF"                         # Warning text and warning-only diagnostics
error = "#EB6F92FF"                           # Error text, confirmations, and diagnostics
insert_hint = "#C4A7E780"                     # Drag-and-drop target preview
backdrop = "#000000FF"                        # Fullscreen gaps and lock screen
shadow = "#00000070"                          # Window shadow

[colors.border]
focused = "#C4A7E7FF"                         # Iris focus ring
unfocused = "#393552FF"
scratchpad_focused = "#F6C177FF"
scratchpad_unfocused = "#44415AFF"
outer = "#1F1D2EFF"

[colors.overview]
background_tint = "#1F1D2E40"                 # Tint over the desktop background
workspace_background = "#00000044"            # Background behind each workspace
badge = "#C4A7E7FF"                           # Overview shortcut badge

# ───────────────────────────── Appearance ───────────────────────────────────
# Documentation: https://docs.noctalia.dev/umbriel/appearance/#window-appearance
# ────────────────────────────────────────────────────────────────────────────

[appearance]
prefer_no_csd = true                            # Prefer Umbriel's border-only decoration
border_width = 2                                # Inner border width, 0-100 logical pixels
outer_border_width = 0                          # Optional outer ring, 0-100 logical pixels
corner_radius = 10                              # Radius of the final decorated edge, 0-100
drag_opacity = 0.75                             # Window opacity during a tiled or floating drag

[appearance.blur]
# Global blur engine. A matching window or layer rule must still opt a surface
# into blur.
enabled = true
optimized = true
passes = 4
radius = 10
noise = 0.02
brightness = 1.0
contrast = 1.0
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 24                                   # Gaussian softness, 0-200
offset_x = 0
offset_y = 5
