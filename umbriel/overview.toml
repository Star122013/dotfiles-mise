# ─────────────────────── Overview and Hot Corners ───────────────────────────
# niri disables hot corners (config/input.kdl: hot-corners off), so all four
# are disabled here.
# Overview: https://docs.noctalia.dev/umbriel/workspaces-overview/
# Hot corners: https://docs.noctalia.dev/umbriel/keybinds/#hot-corners
# ────────────────────────────────────────────────────────────────────────────

[overview]
zoom = 0.5
scroll_factor_horizontal = 1.0
scroll_factor_vertical = 1.0
# background_blur = true
# workspace_wallpaper = true
# shortcuts = true
# shortcut_keys = "1234567890"

[hot_corners.top_left]
enabled = false
delay_ms = 500
action = "overview-open"

[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn:notify-send 'Bottom right'"

