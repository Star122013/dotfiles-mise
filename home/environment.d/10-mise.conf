# ~/.config/environment.d/10-mise.conf — systemd user session environment
# GUI apps started by the session manager get these variables.
# Keep in sync with ~/.profile (same values, no `export` keyword here).

PATH=$HOME/.local/bin:$HOME/.local/share/npm/bin:$PATH

TERMINFO_DIRS=/etc/terminfo:/usr/share/terminfo:/lib/terminfo

XCURSOR_THEME=Bibata-Modern-Ice
XCURSOR_SIZE=24
XCURSOR_PATH=$HOME/.local/share/icons:$HOME/.icons:/usr/share/icons

GDK_BACKEND=wayland,x11,*
BROWSER=chrome
WLR_RENDERER=vulkan
XDG_SESSION_TYPE=wayland
SWAY_UNSUPPORTED_GPU=1
CLUTTER_BACKEND=wayland

QT_QPA_PLATFORM=wayland
QT_QPA_PLATFORMTHEME=gtk3
QT_IM_MODULES=wayland;fcitx

SDL_VIDEODRIVER=wayland,x11
SDL_IM_MODULE=fcitx

MOZ_ENABLE_WAYLAND=1

XMODIFIERS=@im=fcitx
INPUT_METHOD=fcitx

EDITOR=hx
