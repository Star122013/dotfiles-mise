<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Reject COLRv1 format Noto Color Emoji (renders blank in many apps)</description>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/**/*COLRv1*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
