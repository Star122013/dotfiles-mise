<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Default font families (former home-manager fonts module output)</description>

  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Iosevka Curly</family>
      <family>Iosevka Term Curly</family>
      <family>Iosevka Fixed Curly</family>
      <family>Sarasa Term SC</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Sarasa Gothic SC</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Sarasa Gothic SC</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
